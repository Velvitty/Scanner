&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;&lt;base href=&quot;./&quot;&gt;&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src &#x27;none&#x27;; script-src &#x27;none&#x27;; connect-src &#x27;none&#x27;; style-src &#x27;self&#x27; &#x27;unsafe-inline&#x27; https:; img-src &#x27;self&#x27; data: https:; font-src &#x27;self&#x27; data: https:; frame-src &#x27;none&#x27;; object-src &#x27;none&#x27;; form-action &#x27;none&#x27;; base-uri &#x27;self&#x27;&quot;&gt;&lt;style&gt;html{pointer-events:none!important}*{animation-play-state:paused!important;caret-color:transparent!important}&lt;/style&gt;

&lt;title&gt;Posity — 컬러 네거티브 변환기&lt;/title&gt;





&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&amp;amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;amp;family=Outfit:wght@700&amp;amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
/* ───────── 색 토큰: 색 판단을 방해하지 않도록 UI는 완전 무채색 ───────── */
:root{
  --bg:#e7e7e7; --panel:#f3f3f3; --raise:#e4e4e4; --line:#cdcdcd; --line-strong:#a9a9a9;
  --text:#1b1b1b; --muted:#666666; --viewer:#b3b3b3;
  --ink:#1b1b1b; --ink-text:#f3f3f3;
  --film:#1a1a1a; --film-text:#bdbdbd; --hole:#e7e7e7; --hist-bg:#151515;
  color-scheme:light;   /* 선택 상자 목록·체크박스·스크롤 막대 같은 브라우저 기본 부품도 테마를 따르게 */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 어두운 테마: 기기(운영체제)가 어두운 모드이면 항상 따름. 기기가 밝은 모드여도 이 페이지를 감싼 뷰어가
   어두운 테마를 지정하면(data-theme=&quot;dark&quot;) 어둡게. 뷰어가 밝은 테마를 지정해도 기기가 어두우면 어둡게 둠 */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1e1e1e; --panel:#262626; --raise:#303030; --line:#3a3a3a; --line-strong:#5a5a5a;
    --text:#e6e6e6; --muted:#9a9a9a; --viewer:#2c2c2c;
    --ink:#e6e6e6; --ink-text:#1e1e1e;
    --film:#161616; --film-text:#a8a8a8; --hole:#2c2c2c; --hist-bg:#151515;
    color-scheme:dark;
  }
}
:root[data-theme=&quot;dark&quot;]{
  --bg:#1e1e1e; --panel:#262626; --raise:#303030; --line:#3a3a3a; --line-strong:#5a5a5a;
  --text:#e6e6e6; --muted:#9a9a9a; --viewer:#2c2c2c;
  --ink:#e6e6e6; --ink-text:#1e1e1e;
  --film:#161616; --film-text:#a8a8a8; --hole:#2c2c2c; --hist-bg:#151515;
  color-scheme:dark;
}
/* details 안쪽은 UA 섀도 트리의 slot을 거쳐 상속되므로 inherit 대신 직접 지정 */
*,*::before,*::after{box-sizing:border-box}
/* hidden 속성이 display 지정에 묻히지 않도록 */
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.45 &quot;IBM Plex Sans KR&quot;,system-ui,-apple-system,&quot;Apple SD Gothic Neo&quot;,&quot;Malgun Gothic&quot;,&quot;Noto Sans KR&quot;,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,select{
  font:inherit;color:var(--text);background:var(--raise);
  border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;
}
button:hover:not(:disabled),select:hover:not(:disabled){border-color:var(--line-strong)}
button[aria-pressed=&quot;true&quot;],button.primary{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .chip{width:26px;height:18px;border-radius:2px;background:var(--base-chip,var(--line-strong));box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);transition:background .4s}
.brand small{font-size:12px;font-weight:400;color:var(--muted)}
.brand .logo{font:700 16px/1 &quot;Outfit&quot;,&quot;Helvetica Neue&quot;,Arial,system-ui,sans-serif;letter-spacing:.01em}
a.hbtn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--raise);color:var(--text);font:inherit;font-size:13px;text-decoration:none;white-space:nowrap}
a.hbtn:hover{border-color:var(--line-strong)}
.empty .help{font-size:13px;margin:12px 0 0}
.empty .help a,details .more a{color:inherit}
details .more{margin:8px 0 0;font-size:12.5px}
.brand .ver{font:500 11px/1 &quot;IBM Plex Sans Condensed&quot;,&quot;Arial Narrow&quot;,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 5px;letter-spacing:.02em}

.work{display:grid;grid-template-columns:118px minmax(0,1fr) 318px;min-height:0}

/* 필름 스트립: 스프로킷 구멍은 배경으로 그림 */
.strip{
  background-color:var(--film);color:var(--film-text);overflow-y:auto;padding:10px 22px;
  background-image:linear-gradient(to bottom,var(--hole) 0 10px,transparent 10px 22px),linear-gradient(to bottom,var(--hole) 0 10px,transparent 10px 22px);
  background-size:8px 22px,8px 22px;background-repeat:repeat-y;
  background-position:7px 6px,calc(100% - 7px) 6px;background-attachment:local;
}
.strip ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.frame{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;border-radius:0}
.frame .edge{display:block;font:600 12px/1 &quot;IBM Plex Sans Condensed&quot;,&quot;Arial Narrow&quot;,sans-serif;letter-spacing:.02em;margin-bottom:4px;opacity:.8}
.frame .pic{display:grid;place-items:center;aspect-ratio:1;background:#0c0c0c;outline:1px solid #2b2b2b;overflow:hidden}
.frame .pic img{width:100%;height:100%;object-fit:contain;display:block}
.frame .pic span{font-size:11px;color:#6f6f6f;padding:4px;text-align:center;word-break:break-all}
.frame .fname{display:block;font-size:11px;margin-top:4px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame[aria-current=&quot;true&quot;] .pic{outline:2px solid #ececec}
.frame[aria-current=&quot;true&quot;] .edge{opacity:1}
.strip li{position:relative}
.fdel{position:absolute;top:-3px;right:0;width:20px;height:20px;padding:0;border-radius:3px;font-size:14px;line-height:1;background:rgba(0,0,0,.6);color:#ddd;border:1px solid #444;opacity:0}
.strip li:hover .fdel,.fdel:focus-visible{opacity:1}
@media (hover: none){ .fdel{opacity:.85} }
.strip .none{font-size:11px;color:#6f6f6f;line-height:1.5}

/* 작업 영역 */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--viewer)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.viewer{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;touch-action:manipulation}
.viewer.cropping{touch-action:none}
.viewer.drag{outline:2px dashed var(--text);outline-offset:-10px}
#view{display:block;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
#view.pick{cursor:crosshair}
#view.crop{cursor:crosshair}
.empty{max-width:40ch;text-align:center;color:var(--muted);padding:24px}
.empty strong{display:block;color:var(--text);font-size:18px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.empty p{margin:0 0 14px}
.status{display:flex;justify-content:space-between;gap:16px;padding:6px 12px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
.status span:last-child{text-align:right}

.loupe{position:absolute;right:14px;bottom:14px;width:220px;height:220px;background:#000;border:1px solid var(--line-strong)}
.loupe canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.loupe b{position:absolute;left:7px;top:5px;font-size:11px;font-weight:500;color:#fff;mix-blend-mode:difference}

.busy{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--viewer) 82%,transparent)}
.busy .bt{font-weight:600}
.busy .bd{font-size:12px;color:var(--muted);max-width:40ch}
.busy .track{width:240px;height:3px;background:var(--line);justify-self:center}
.busy .fill{height:100%;width:0;background:var(--text)}
.busy button{justify-self:center;margin-top:2px}

/* 오른쪽 패널 */
.panel{overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 16px 24px}
.hist{position:relative;height:96px;background:var(--hist-bg);border-radius:3px}
.hist canvas{width:100%;height:100%;display:block}
.sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sec &gt; summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.sec &gt; summary::-webkit-details-marker{display:none}
.sec &gt; summary::after{content:&quot;＋&quot;;color:var(--muted);font-weight:400}
.sec[open] &gt; summary::after{content:&quot;－&quot;}
.sec &gt; summary + *{margin-top:6px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:9px 0 2px}
.ctl label{color:var(--muted);user-select:none}
.ctl output{font-size:12px}
.ctl input{grid-column:1/-1;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;margin:9px 0}
.field span{color:var(--muted)}
.field select{width:100%;min-width:0;text-overflow:ellipsis}
.base{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin:4px 0}
.base .sw{width:44px;height:30px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);background:var(--raise)}
.base .v{font-size:12px;line-height:1.4}
.base .v em{font-style:normal;color:var(--muted)}
.dens{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px;margin:8px 0;color:var(--muted)}
.dens b{font-weight:500;color:var(--text)}
.note{font-size:12px;color:var(--muted);margin:6px 0}
#encNote{overflow-wrap:anywhere}
.how ol{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
.how li{margin:4px 0}
.foot{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.foot button{flex:1 1 40%}

/* Ai+ 스위치 */
.aibox{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--raise)}
.aisw{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;-webkit-user-select:none}
.aisw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.aisw .sw{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--line-strong);transition:background .15s}
.aisw .sw::after{content:&quot;&quot;;position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.aisw input:checked + .sw{background:var(--ink)}
.aisw input:checked + .sw::after{transform:translateX(14px)}
.aisw input:focus-visible + .sw{outline:2px solid var(--text);outline-offset:2px}
.aisw b{font:600 16px/1 &quot;IBM Plex Sans Condensed&quot;,&quot;Arial Narrow&quot;,sans-serif;letter-spacing:.02em}
.aist{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.aiinfo{margin-top:8px;display:grid;gap:6px}
.aiscene{font-size:12px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
.aiskip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.aiinfo .note{margin:0}

/* 슬라이더: 얇은 선 + 페이더 손잡이 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:16px;margin-top:-7px;border-radius:2px;background:var(--text);border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--line-strong)}
input[type=range]::-moz-range-thumb{width:9px;height:16px;border-radius:2px;background:var(--text);border:0}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
.ctl.temp input::-webkit-slider-runnable-track{background:linear-gradient(90deg,#5b82d6,#9a9a9a,#d7a64a)}
.ctl.temp input::-moz-range-track{background:linear-gradient(90deg,#5b82d6,#9a9a9a,#d7a64a)}
.ctl.tint input::-webkit-slider-runnable-track{background:linear-gradient(90deg,#55ad5e,#9a9a9a,#c05cbf)}
.ctl.tint input::-moz-range-track{background:linear-gradient(90deg,#55ad5e,#9a9a9a,#c05cbf)}

/* 툴바 안 슬라이더(기울기, 자르는 동안만): 이름 · 슬라이더 · 값 한 줄 */
.toolbar .ctl{display:flex;align-items:center;gap:6px;margin:0 2px}
.toolbar .ctl input{width:120px;order:1}
.toolbar .ctl output{order:2;min-width:48px}
/* 되돌리기·다시 하기 글자는 넓은 화면에서만 (그 밖에는 ↶ ↷ 기호만, 이름은 aria-label·title) → 도구 막대가 한 줄에 들어감 */
@media (max-width: 1366px){ .toolbar .tl{display:none} #btnUndo,#btnRedo{padding-left:8px;padding-right:8px} }
.viewer.drawing{touch-action:none}
/* 필름 스트립 여러 장 고르기: 고른 프레임은 회색 테두리와 ✓ 표시 (지금 연 프레임은 흰 테두리) */
.frame{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.frame .pic{position:relative}
.frame.sel .pic{outline:2px solid #8f8f8f}
.frame.sel[aria-current=&quot;true&quot;] .pic{outline-color:#ececec}
.frame.sel .pic::after{content:&quot;✓&quot;;position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#ececec;color:#111;font:600 11px/16px system-ui,sans-serif;text-align:center}
.selinfo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 0 0}
.selinfo span{flex:1}
.selinfo button{padding:2px 9px;font-size:12px;flex:none}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-text);padding:8px 14px;border-radius:4px;font-size:12px;max-width:min(90vw,520px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.act.on{pointer-events:auto}
.toast button{margin-left:10px;padding:2px 9px;background:transparent;color:inherit;border-color:currentColor;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width: 900px){
  html,body,.app{height:auto}
  .work{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .strip{
    padding:22px 10px;overflow-x:auto;overflow-y:hidden;
    background-image:linear-gradient(to right,var(--hole) 0 10px,transparent 10px 22px),linear-gradient(to right,var(--hole) 0 10px,transparent 10px 22px);
    background-size:22px 8px,22px 8px;background-repeat:repeat-x;
    background-position:6px 7px,6px calc(100% - 7px);
  }
  .strip ol{flex-direction:row}
  .strip li{flex:0 0 84px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .loupe{width:150px;height:150px}
  .toolbar .sep{display:none}
  /* 좁은 화면: 고르는 동안 붙여넣기·선택 해제를 화면 아래에 띄움 (필름 스트립에서 멀리 내려가지 않게) */
  .selinfo{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin:0;padding:8px 10px;background:var(--ink);color:var(--ink-text);border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
  .selinfo button{background:transparent;color:inherit;border-color:currentColor;padding:6px 10px}
  body.selon{padding-bottom:64px}
  body.selon .toast{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
}
/* 손가락 조작: 슬라이더 손잡이를 키움 */
@media (pointer: coarse){
  input[type=range]{height:30px}
  input[type=range]::-webkit-slider-thumb{width:16px;height:26px;margin-top:-12px}
  input[type=range]::-moz-range-thumb{width:16px;height:26px}
}
[data-act=&quot;neg&quot;]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
&lt;/style&gt;
&lt;/head&gt;
&lt;body inert&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;header class=&quot;bar&quot;&gt;
    &lt;div class=&quot;brand&quot;&gt;&lt;span class=&quot;chip&quot; id=&quot;brandChip&quot; title=&quot;현재 프레임의 필름 베이스 색&quot;&gt;&lt;/span&gt;&lt;span class=&quot;logo&quot;&gt;Posity&lt;/span&gt; &lt;small&gt;컬러 네거티브 → 포지티브&lt;/small&gt; &lt;span class=&quot;ver&quot; id=&quot;ver&quot; title=&quot;버전&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;button id=&quot;btnOpen&quot; class=&quot;primary&quot;&gt;스캔 열기&lt;/button&gt;
    &lt;input id=&quot;file&quot; type=&quot;file&quot; multiple accept=&quot;image/*,.tif,.tiff,.png,.dng&quot; class=&quot;sr&quot; tabindex=&quot;-1&quot;&gt;
    &lt;label class=&quot;sr&quot; for=&quot;fmt&quot;&gt;내보내기 형식&lt;/label&gt;
    &lt;select id=&quot;fmt&quot; disabled&gt;
      &lt;option value=&quot;jpg&quot;&gt;JPEG (8비트)&lt;/option&gt;
      &lt;option value=&quot;png8&quot;&gt;PNG (8비트)&lt;/option&gt;
      &lt;option value=&quot;png16&quot;&gt;PNG (16비트)&lt;/option&gt;
      &lt;option value=&quot;tif16&quot; title=&quot;16비트 TIFF: 무손실 압축(Deflate), sRGB 색 프로필 포함. 다른 편집 프로그램에서 더 손볼 때&quot;&gt;TIFF (16비트)&lt;/option&gt;
    &lt;/select&gt;
    &lt;label class=&quot;sr&quot; for=&quot;jq&quot;&gt;JPEG 품질&lt;/label&gt;
    &lt;select id=&quot;jq&quot; disabled title=&quot;JPEG 품질: 높을수록 화질 손실이 적고 파일이 큼&quot;&gt;
      &lt;option value=&quot;0.92&quot;&gt;품질 92&lt;/option&gt;
      &lt;option value=&quot;0.95&quot; selected&gt;품질 95&lt;/option&gt;

        &lt;p class=&quot;note&quot;&gt;자르기 영역에서 테두리 여백을 뺀 부분으로 채널별 그림자·하이라이트 밀도를 찾습니다. 홀더나 빛샘이 들어가면 여백을 늘리세요.&lt;/p&gt;
      &lt;/details&gt;

      &lt;details class=&quot;sec how&quot;&gt;
        &lt;summary&gt;변환 원리&lt;/summary&gt;
        &lt;ol&gt;
          &lt;li&gt;스캔값을 인코딩에 맞춰 선형 투과율 T로 되돌립니다.&lt;/li&gt;
          &lt;li&gt;필름 베이스 T&lt;sub&gt;b&lt;/sub&gt;로 나눠 오렌지 마스크를 걷어내고 밀도 D = −log₁₀(T/T&lt;sub&gt;b&lt;/sub&gt;)로 바꿉니다.&lt;/li&gt;
          &lt;li&gt;채널마다 그림자·하이라이트 밀도를 0–1로 정규화합니다. 감광층마다 다른 감마가 여기서 맞춰집니다.&lt;/li&gt;
          &lt;li&gt;노출·색온도·색조는 채널별 인화 노출(로그 영역)에 더해집니다. 확대기의 CMY 필터와 같은 원리입니다.&lt;/li&gt;
          &lt;li&gt;가상 인화지의 S자 특성곡선(최대 농도 2.4)으로 반사율을 만든 뒤 채도·선명도를 거쳐 sRGB로 인코딩합니다.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;p class=&quot;more&quot;&gt;&lt;a href=&quot;information.html#part-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;도움말에서 자세히 보기&lt;/a&gt;&lt;/p&gt;
      &lt;/details&gt;

      &lt;details class=&quot;sec how&quot;&gt;
        &lt;summary&gt;Ai+ 원리&lt;/summary&gt;
        &lt;ol&gt;
          &lt;li&gt;기존 방식의 필름 해석(베이스 제거, 채널별 정규화)은 그대로 쓰고, 마지막 가상 인화지 대신 디지털카메라처럼 렌더링합니다. 인화지 곡선은 채널마다 걸려 하늘 같은 밝은 색은 바래고 그림자 색은 짙어지기 때문입니다.&lt;/li&gt;
          &lt;li&gt;화이트밸런스: 밝기 구간마다 &#x27;무채색일 법한 곳&#x27;이 모이는 색을 찾고, 여러 구간이 매끄럽게 이어지는 색 틀어짐만 실제 캐스트로 인정해 밝기별로 뺍니다. 필름 층마다 특성곡선 모양이 달라 양 끝은 맞아도 중간 톤만 초록·마젠타로 남는 크로스오버까지 잡습니다. 하늘·나무 같은 큰 단색 면이 후보를 독차지하지 못하게 칸마다 표를 제한하고, 장면 전체의 평균색이 같은 방향일 때만 그만큼 믿습니다. 실내등·노을의 따뜻함은 카메라 자동 화이트밸런스처럼 조금 남깁니다.&lt;/li&gt;
          &lt;li&gt;밝기: 중앙을 더 보고 하늘처럼 훨씬 밝은 곳은 가볍게 보는 측광으로 중간 밝기를 맞춥니다. 보통 장면은 모두 같은 밝기로, 눈밭·야경처럼 분명히 밝거나 어두운 장면만 그 분위기를 따릅니다.&lt;/li&gt;
